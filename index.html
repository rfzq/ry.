<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard da Organização</title>
    <style>
        :root {
            --bg-principal: #0b0e14;
            --bg-card: #151922;
            --bg-input: #1b202e;
            --cor-primaria: #00f2fe;
            --cor-segundaria: #4facfe;
            --cor-sucesso: #00ff87;
            --cor-perigo: #ff3366;
            --texto-principal: #f1f5f9;
            --texto-secundario: #94a3b8;
            --borda: #242b3d;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, var(--cor-primaria), var(--cor-segundaria));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        header p {
            color: var(--texto-secundario);
            margin-top: 10px;
            font-size: 1rem;
        }

        .box {
            background-color: var(--bg-card);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
        }

        .box h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-section {
            display: none;
            border: 1px dashed var(--cor-primaria);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: var(--bg-input);
            color: var(--cor-sucesso);
            border: 1px solid var(--borda);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: var(--cor-primaria);
        }

        input[type="password"] {
            background-color: var(--bg-input);
            color: white;
            border: 1px solid var(--borda);
            padding: 10px 14px;
            border-radius: 8px;
            width: 180px;
            outline: none;
            font-size: 14px;
        }

        button {
            background: linear-gradient(135deg, var(--cor-primaria), var(--cor-segundaria));
            color: #05070a;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }

        .tables-container {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
        }

        @media (max-width: 850px) {
            .tables-container { grid-template-columns: 1fr; }
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px;
            text-align: left;
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--texto-secundario);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border-bottom: 2px solid var(--borda);
        }

        td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 15px;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.01);
        }

        .meta-bar-bg {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            width: 100%;
            height: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .meta-bar-fill {
            background: linear-gradient(90deg, #00ff87, #60efff);
            height: 100%;
            width: 0%;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 255, 135, 0.5);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .text-red { color: var(--cor-perigo); font-weight: 600; }
        .text-green { color: var(--cor-sucesso); font-weight: 600; }

        .footer-admin {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
    </style>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

<div class="container">
    <header>
        <h1>💎 PAINEL OPERACIONAL</h1>
        <p>Controle Diário de Metas e Movimentação de Materiais</p>
    </header>
    
    <!-- Painel Admin -->
    <div id="adminPanel" class="box admin-section">
        <h3>🛡️ Gerenciamento da Liderança</h3>
        <textarea id="logInput" placeholder="Cole novas linhas de logs aqui para gerar a nova atualização fixa..."></textarea>
        <div style="margin-top: 15px; display: flex; gap: 12px;">
            <button onclick="processarLogs()">Atualizar Banco</button>
        </div>
    </div>

    <div class="tables-container">
        <!-- Tabela Entregas -->
        <div class="box">
            <h3>📥 Ranking de Entregas <span style="font-size: 13px; color: var(--texto-secundario); font-weight: normal; margin-left: auto;">Meta: 25.000 und</span></h3>
            <table>
                <thead>
                    <tr>
                        <th>Membro</th>
                        <th>Quantidade</th>
                        <th>Progresso</th>
                    </tr>
                </thead>
                <tbody id="rankingEntregas"></tbody>
            </table>
        </div>

        <!-- Tabela Retiradas -->
        <div class="box">
            <h3>📤 Retiradas do Depósito</h3>
            <table>
                <thead>
                    <tr>
                        <th>Membro</th>
                        <th>Total Retirado</th>
                    </tr>
                </thead>
                <tbody id="rankingRetiradas"></tbody>
            </table>
        </div>
    </div>

    <!-- Login do Admin no rodapé -->
    <div class="footer-admin">
        <input type="password" id="senhaAdmin" placeholder="Acesso Restrito">
        <button onclick="verificarSenha()">Modo Admin</button>
    </div>
</div>

<script>
const SENHA_CORRETA = "1407"; 
const META = 25000;

// 💾 BANCO DE DADOS FIXO NA NUVEM
const BANCO_DADOS = {
    entregas: {"_DG_": 23961, "jasintox": 17997, "LOPERAS": 15000, "ruts_kailer": 7219},
    retiradas: {"LOPERAS": 11000, "_DG_": 1820}
};

window.onload = function() {
    renderizarTabelas(BANCO_DADOS.entregas, BANCO_DADOS.retiradas);
};

function verificarSenha() {
    if (document.getElementById('senhaAdmin').value === SENHA_CORRETA) {
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('adminPanel').scrollIntoView({ behavior: 'smooth' });
    } else {
        alert('Acesso negado: Senha inválida.');
    }
}

function processarLogs() {
    const text = document.getElementById('logInput').value;
    const lines = text.split('\n');
    let e = {...BANCO_DADOS.entregas};
    let r = {...BANCO_DADOS.retiradas};

    const regexEntregou = /\|\s*([\w]+)\s+entregou\s+(\d+)/i;
    const regexUsou = /\|\s*([\w]+)\s+usou\s+(\d+)/i;

    lines.forEach(line => {
        const mE = line.match(regexEntregou);
        if (mE) e[mE] = (e[mE] || 0) + parseInt(mE, 10);
        const mU = line.match(regexUsou);
        if (mU) r[mU] = (r[mU] || 0) + parseInt(mU, 10);
    });
    
    renderizarTabelas(e, r);
    alert('Modificações aplicadas com sucesso!');
}

function renderizarTabelas(entregas, retiradas) {
    const tE = document.getElementById('rankingEntregas');
    tE.innerHTML = '';
    Object.entries(entregas).sort((a,b)=>b-a).forEach(([name,total]) => {
        const p = Math.min((total/META)*100, 100).toFixed(1);
        tE.innerHTML += `<tr><td><strong>${name}</strong></td><td class="text-green">${total.toLocaleString('pt-BR')} und</td><td><div style="display:flex;align-items:center;gap:12px;"><div class="meta-bar-bg" style="flex-grow:1;"><div class="meta-bar-fill" style="width:${p}%;"></div></div><span style="font-size:12px;font-weight:600;min-width:40px;text-align:right;">${p}%</span></div></td></tr>`;
    });

    const tR = document.getElementById('rankingRetiradas');
    tR.innerHTML = '';
    Object.entries(retiradas).sort((a,b)=>b-a).forEach(([name,total]) => {
        tR.innerHTML += `<tr><td><strong>${name}</strong></td><td class="text-red">${total.toLocaleString('pt-BR')} und</td></tr>`;
    });
}
</script>
</body>
</html>
