<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard da Organização</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12141c;
            color: #e1e1e6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 { color: #00adb5; text-align: center; margin-bottom: 30px; }
        .box {
            background-color: #1e222b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #2d323f;
        }
        .admin-section {
            display: none;
            border: 1px dashed #00adb5;
        }
        textarea {
            width: 100%;
            height: 120px;
            background-color: #12141c;
            color: #00ff66;
            border: 1px solid #2d323f;
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            resize: vertical;
            box-sizing: border-box;
        }
        input[type="password"] {
            background-color: #12141c;
            color: white;
            border: 1px solid #2d323f;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            width: 200px;
        }
        button {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #008c95; }
        .btn-danger { background-color: #ff4a4a; }
        .btn-danger:hover { background-color: #d93838; }
        .tables-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .tables-container { grid-template-columns: 1fr; }
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2d323f;
        }
        th { background-color: #252a34; color: #00adb5; }
        .meta-bar-bg {
            background-color: #12141c;
            border-radius: 4px;
            width: 100%;
            height: 18px;
            overflow: hidden;
        }
        .meta-bar-fill {
            background-color: #00ff66;
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }
        .text-red { color: #ff4a4a; font-weight: bold; }
        .text-green { color: #00ff66; font-weight: bold; }
        .footer-admin {
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Painel de Controle de Materiais</h1>
    
    <!-- Painel de Administração Oculto por padrão -->
    <div id="adminPanel" class="box admin-section">
        <h3>🔑 Painel do Líder (Inserir Dados)</h3>
        <textarea id="logInput" placeholder="Cole os novos logs aqui para somar ao banco de dados existente..."></textarea>
        <div style="margin-top: 10px; display: flex; gap: 10px;">
            <button onclick="processarLogs()">Adicionar Logs ao Painel</button>
            <button onclick="limparDados()" class="btn-danger">Zerar Todo o Painel</button>
        </div>
    </div>

    <div class="tables-container">
        <!-- Tabela de Entregas -->
        <div class="box">
            <h3>📥 Ranking de Entregas (Meta: 25k)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Jogador</th>
                        <th>Total Entregue</th>
                        <th>Progresso</th>
                    </tr>
                </thead>
                <tbody id="rankingEntregas">
                    <tr><td colspan="3" style="text-align: center; color: #888;">Nenhum material registrado.</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Tabela de Retiradas -->
        <div class="box">
            <h3>📤 Registro de Retiradas (Quem Usou)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Jogador</th>
                        <th>Total Retirado</th>
                    </tr>
                </thead>
                <tbody id="rankingRetiradas">
                    <tr><td colspan="2" style="text-align: center; color: #888;">Nenhuma retirada registrada.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Botão discreto no rodapé para o líder abrir as configurações -->
    <div class="footer-admin">
        <input type="password" id="senhaAdmin" placeholder="Senha do Líder">
        <button onclick="verificarSenha()">Acessar Modo Admin</button>
    </div>
</div>

<script>
// 🔑 Senha atualizada conforme solicitado
const SENHA_CORRETA = "1407"; 

const META = 25000;

// Carrega os dados salvos automaticamente quando a página abre
window.onload = function() {
    renderizarTabelas();
};

function verificarSenha() {
    const senhaDigitada = document.getElementById('senhaAdmin').value;
    if (senhaDigitada === SENHA_CORRETA) {
        document.getElementById('adminPanel').style.display = 'block';
        alert('Modo Administrador liberado!');
    } else {
        alert('Senha incorreta!');
    }
}

function processarLogs() {
    const text = document.getElementById('logInput').value;
    const lines = text.split('\n');
    
    // Puxa o que já estava salvo ou cria um objeto vazio
    let entregas = JSON.parse(localStorage.getItem('entregas')) || {};
    let retiradas = JSON.parse(localStorage.getItem('retiradas')) || {};

    const regexEntregou = /\|\s*([\w]+)\s+entregou\s+(\d+)/i;
    const regexUsou = /\|\s*([\w]+)\s+usou\s+(\d+)/i;

    lines.forEach(line => {
        const matchEntrega = line.match(regexEntregou);
        if (matchEntrega) {
            const player = matchEntrega[1];
            const amount = parseInt(matchEntrega[2], 10);
            entregas[player] = (entregas[player] || 0) + amount;
        }

        const matchUsou = line.match(regexUsou);
        if (matchUsou) {
            const player = matchUsou[1];
            const amount = parseInt(matchUsou[2], 10);
            retiradas[player] = (retiradas[player] || 0) + amount;
        }
    });

    // Salva permanentemente no navegador
    localStorage.setItem('entregas', JSON.stringify(entregas));
    localStorage.setItem('retiradas', JSON.stringify(retiradas));

    document.getElementById('logInput').value = '';
    renderizarTabelas();
    alert('Logs processados e salvos com sucesso!');
}

function renderizarTabelas() {
    const entregas = JSON.parse(localStorage.getItem('entregas')) || {};
    const retiradas = JSON.parse(localStorage.getItem('retiradas')) || {};

    // Atualiza Entregas
    const tbodyEntregas = document.getElementById('rankingEntregas');
    tbodyEntregas.innerHTML = '';
    const sortedEntregas = Object.entries(entregas).sort((a, b) => b[1] - a[1]);

    if (sortedEntregas.length === 0) {
        tbodyEntregas.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #888;">Nenhum material registrado.</td></tr>`;
    } else {
        sortedEntregas.forEach(([name, total]) => {
            const percentage = Math.min((total / META) * 100, 100).toFixed(1);
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${name}</strong></td>
                <td class="text-green">${total.toLocaleString('pt-BR')} und</td>
                <td>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div class="meta-bar-bg" style="flex-grow: 1;">
                            <div class="meta-bar-fill" style="width: ${percentage}%;"></div>
                        </div>
                        <span style="font-size: 11px; min-width: 35px;">${percentage}%</span>
                    </div>
                </td>
            `;
            tbodyEntregas.appendChild(row);
        });
    }

    // Atualiza Retiradas
    const tbodyRetiradas = document.getElementById('rankingRetiradas');
    tbodyRetiradas.innerHTML = '';
    const sortedRetiradas = Object.entries(retiradas).sort((a, b) => b[1] - a[1]);

    if (sortedRetiradas.length === 0) {
        tbodyRetiradas.innerHTML = `<tr><td colspan="2" style="text-align: center; color: #888;">Nenhuma retirada registrada.</td></tr>`;
    } else {
        sortedRetiradas.forEach(([name, total]) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${name}</strong></td>
                <td class="text-red">${total.toLocaleString('pt-BR')} und</td>
            `;
            tbodyRetiradas.appendChild(row);
        });
    }
}

function limparDados() {
    if (confirm('Tem certeza que deseja apagar todo o histórico de materiais do painel?')) {
        localStorage.clear();
        renderizarTabelas();
        alert('Painel zerado!');
    }
}
</script>

</body>
</html>
