<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard da Organização</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12141c;
            color: #e1e1e6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 { color: #00adb5; text-align: center; margin-bottom: 30px; }
        .box {
            background-color: #1e222b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #2d323f;
        }
        .admin-section {
            display: none;
            border: 1px dashed #00adb5;
        }
        textarea {
            width: 100%;
            height: 120px;
            background-color: #12141c;
            color: #00ff66;
            border: 1px solid #2d323f;
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            resize: vertical;
            box-sizing: border-box;
        }
        input[type="password"] {
            background-color: #12141c;
            color: white;
            border: 1px solid #2d323f;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            width: 200px;
        }
        button {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #008c95; }
        .btn-danger { background-color: #ff4a4a; }
        .btn-danger:hover { background-color: #d93838; }
        .tables-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .tables-container { grid-template-columns: 1fr; }
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2d323f;
        }
        th { background-color: #252a34; color: #00adb5; }
        .meta-bar-bg {
            background-color: #12141c;
            border-radius: 4px;
            width: 100%;
            height: 18px;
            overflow: hidden;
        }
        .meta-bar-fill {
            background-color: #00ff66;
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }
        .text-red { color: #ff4a4a; font-weight: bold; }
        .text-green { color: #00ff66; font-weight: bold; }
        .footer-admin {
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Painel de Controle de Materiais</h1>
    
    <div id="adminPanel" class="box admin-section">
        <h3>🔑 Painel do Líder (Inserir Dados)</h3>
        <p style="font-size: 13px; color: #aaa;">Cole novos logs para recalcular e gerar um novo bloco de dados fixo para atualizar o código.</p>
        <textarea id="logInput" placeholder="Cole os novos logs aqui..."></textarea>
        <div style="margin-top: 10px;">
            <button onclick="processarLogs()">Gerar Novo Bloco de Código</button>
        </div>
    </div>

    <div class="tables-container">
        <!-- Tabela de Entregas -->
        <div class="box">
            <h3>📥 Ranking de Entregas (Meta: 25k)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Jogador</th>
                        <th>Total Entregue</th>
                        <th>Progresso</th>
                    </tr>
                </thead>
                <tbody id="rankingEntregas"></tbody>
            </table>
        </div>

        <!-- Tabela de Retiradas -->
        <div class="box">
            <h3>📤 Registro de Retiradas (Quem Usou)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Jogador</th>
                        <th>Total Retirado</th>
                    </tr>
                </thead>
                <tbody id="rankingRetiradas"></tbody>
            </table>
        </div>
    </div>

    <div class="footer-admin">
        <input type="password" id="senhaAdmin" placeholder="Senha do Líder">
        <button onclick="verificarSenha()">Acessar Modo Admin</button>
    </div>
</div>

<script>
const SENHA_CORRETA = "1407"; 
const META = 25000;

// 💾 DADOS FIXOS SALVOS NA NUVEM (Atualizado hoje)
const BANCO_DADOS = {
    entregas: {"_DG_": 23961, "jasintox": 17997, "LOPERAS": 15000, "ruts_kailer": 7219},
    retiradas: {"LOPERAS": 11000, "_DG_": 1820}
};

window.onload = function() {
    renderizarTabelas(BANCO_DADOS.entregas, BANCO_DADOS.retiradas);
};

function verificarSenha() {
    if (document.getElementById('senhaAdmin').value === SENHA_CORRETA) {
        document.getElementById('adminPanel').style.display = 'block';
        alert('Modo Administrador liberado!');
    } else {
        alert('Senha incorreta!');
    }
}

function processarLogs() {
    const text = document.getElementById('logInput').value;
    const lines = text.split('\n');
    
    let e = {...BANCO_DADOS.entregas};
    let r = {...BANCO_DADOS.retiradas};

    const regexEntregou = /\|\s*([\w]+)\s+entregou\s+(\d+)/i;
    const regexUsou = /\|\s*([\w]+)\s+usou\s+(\d+)/i;

    lines.forEach(line => {
        const mE = line.match(regexEntregou);
        if (mE) e[mE[1]] = (e[mE[1]] || 0) + parseInt(mE[2], 10);
        const mU = line.match(regexUsou);
        if (mU) r[mU[1]] = (r[mU[1]] || 0) + parseInt(mU[2], 10);
    });

    console.log("Novo BANCO_DADOS para substituir no código:");
    console.log(JSON.stringify({entregas: e, retiradas: r}));
    
    renderizarTabelas(e, r);
    alert('Novos totais gerados na tela! Copie os novos objetos gerados no console do navegador para fixar no código do GitHub.');
}

function renderizarTabelas(entregas, retiradas) {
    const tE = document.getElementById('rankingEntregas');
    tE.innerHTML = '';
    Object.entries(entregas).sort((a,b)=>b[1]-a[1]).forEach(([name,total]) => {
        const p = Math.min((total/META)*100, 100).toFixed(1);
        tE.innerHTML += `<tr><td><strong>${name}</strong></td><td class="text-green">${total.toLocaleString('pt-BR')} und</td><td><div style="display:flex;align-items:center;gap:8px;"><div class="meta-bar-bg" style="flex-grow:1;"><div class="meta-bar-fill" style="width:${p}%;"></div></div><span style="font-size:11px;min-width:35px;">${p}%</span></div></td></tr>`;
    });

    const tR = document.getElementById('rankingRetiradas');
    tR.innerHTML = '';
    Object.entries(retiradas).sort((a,b)=>b[1]-a[1]).forEach(([name,total]) => {
        tR.innerHTML += `<tr><td><strong>${name}</strong></td><td class="text-red">${total.toLocaleString('pt-BR')} und</td></tr>`;
    });
}
</script>
</body>
</html>
